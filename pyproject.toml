[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tag-env"
version = "0.1.0"
description = "Time-varying tag-game POMDP (ECE 595 project), based on Pineau et al. 2003"
requires-python = ">=3.9"
dependencies = ["gymnasium>=0.29", "numpy"]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools]
packages = ["tag_env"]
